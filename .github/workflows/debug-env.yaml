name: Debug Env
on: workflow_dispatch
jobs:
  env:
    name: Dump Env
    runs-on: macos-26
    steps:
      - name: Dump Env 🧪
        run: |
          env | grep -E "DEPLOYMENT|SDK" | sort
          echo '---'
          unset MACOSX_DEPLOYMENT_TARGET
          echo 'int main(){return 0;}' > /tmp/t.c
          clang++ -c /tmp/t.c -o /tmp/t.o -v 2>&1 | head -5 || true
          echo '--- with all deployment vars set like suspected ---'
          MACOSX_DEPLOYMENT_TARGET=26.5 clang++ -c /tmp/t.c -o /tmp/t.o 2>&1 | head -3 || true
          xcodebuild -showsdks | grep -i macosx || true
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          env | grep -E "DEPLOYMENT" | sort
